name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Set this repo variable to your deployed API, e.g. https://api.merepoints.in/v1
  API_URL: ${{ vars.API_URL || 'http://10.0.2.2:3000/v1' }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --platforms=android,ios --org com.merepoints --project-name mere_points .
      - run: dart run tool/configure_platforms.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_URL=$API_URL
      - uses: actions/upload-artifact@v4
        with:
          name: mere-points-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --platforms=android,ios --org com.merepoints --project-name mere_points .
      - run: dart run tool/configure_platforms.dart
      - run: flutter pub get
      # Compiles the full iOS app. Signing for TestFlight/App Store needs your Apple developer
      # certificates added as secrets; until then this proves the iOS build is green.
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=$API_URL

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: merepoints_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npx tsc -p . --noEmit
      - run: npm test
        env: { TEST_DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/merepoints_test' }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
        env: { NEXT_TELEMETRY_DISABLED: '1' }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t merepoints-api api
      - run: docker build -t merepoints-web web
