name: mere_points
description: Mere Points — one app for shops and their customers (carpenters, painters, contractors…).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3        # camera QR scanning (shop counter)
  audioplayers: ^6.1.0          # celebration sound
  google_sign_in: ^6.2.2        # Google login (needs GOOGLE_WEB_CLIENT_ID at build time)
  permission_handler: ^11.3.1   # explicit camera permission step + open settings
  qr_flutter: ^4.1.0            # customer's rotating QR
  geocoding: ^3.0.0             # GPS to city / area, done on the phone
  geolocator: ^12.0.0           # shop GPS at sign-up, nearby shops
  url_launcher: ^6.3.0          # UPI apps, phone calls, maps
  share_plus: ^10.1.4           # share CSV reports
  intl: any                     # version pinned by flutter_localizations
  image_picker: ^1.1.2          # product / ad photos (camera or gallery)
  image: ^4.2.0                 # shrink bill photos under 500 KB on the phone (pure Dart)
  firebase_core: ^3.8.1         # phone push (set FIREBASE_* with --dart-define; push stays off without them)
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1   # dart run flutter_launcher_icons  (setup.sh runs it)
  flutter_native_splash: ^2.4.1     # dart run flutter_native_splash:create

# App icon: full-bleed yellow square (iOS masks the corners); Android adaptive icon = yellow + MP mark in the safe zone.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon-1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#F4AA04"
  adaptive_icon_foreground: assets/brand/icon-foreground.png
  min_sdk_android: 21

# Launch screen while Flutter starts: white with the app icon (matches the in-app splash).
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/icon-192.png
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#F4AA04"
    image: assets/brand/icon-foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/sounds/
  # Mukta covers Latin + Devanagari. Drop the TTFs in assets/fonts and uncomment.
  # fonts:
  #   - family: Mukta
  #     fonts:
  #       - asset: assets/fonts/Mukta-Regular.ttf
  #       - asset: assets/fonts/Mukta-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Mukta-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Mukta-ExtraBold.ttf
  #         weight: 800
