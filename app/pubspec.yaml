name: mere_points
description: Mere Points — one app for shops and their customers (carpenters, painters, contractors…).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3        # camera QR scanning (shop counter)
  qr_flutter: ^4.1.0            # customer's rotating QR
  geolocator: ^12.0.0           # shop GPS at sign-up, nearby shops
  url_launcher: ^6.3.0          # UPI apps, phone calls, maps
  share_plus: ^10.1.4           # share CSV reports
  intl: any                     # version pinned by flutter_localizations
  image_picker: ^1.1.2          # product / ad photos (camera or gallery)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Mukta covers Latin + Devanagari. Drop the TTFs in assets/fonts and uncomment.
  # fonts:
  #   - family: Mukta
  #     fonts:
  #       - asset: assets/fonts/Mukta-Regular.ttf
  #       - asset: assets/fonts/Mukta-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Mukta-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Mukta-ExtraBold.ttf
  #         weight: 800
